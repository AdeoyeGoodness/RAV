# RAV Production nginx configuration
# Host: 172.16.100.41
# Reachable from subnets: 172.16.100.0/22, 10.0.0.0/22, 172.16.0.0/22
#
# Install:
#   sudo cp nginx-rav.conf /etc/nginx/sites-available/rav
#   sudo ln -s /etc/nginx/sites-available/rav /etc/nginx/sites-enabled/rav
#   sudo nginx -t && sudo systemctl reload nginx
#
# Companion env on the RAV host (.env consumed by the backend + dashboard):
#   BACKEND_HOST=127.0.0.1
#   BACKEND_PORT=8080
#   S3_ENDPOINT=http://172.16.100.41/minio
#   CORS_ALLOWED_ORIGINS=http://172.16.100.41
#   NEXT_PUBLIC_API_URL=http://172.16.100.41   (baked into the dashboard at build time)
#
# Companion MinIO env (so presigned URLs are signed for the public hostname clients see):
#   MINIO_SERVER_URL=http://172.16.100.41/minio
#   MINIO_BROWSER_REDIRECT_URL=http://172.16.100.41/console

# ========================================================================
# UPSTREAMS — Rust backend and Next.js standalone server
# No ip_hash needed (REST only, no Socket.IO / sticky sessions)
# ========================================================================
upstream rav_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream rav_dashboard {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream rav_minio {
    server 127.0.0.1:9000;
    keepalive 32;
}

upstream rav_minio_console {
    server 127.0.0.1:9001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name 172.16.100.41 _;

    # ====================================================================
    # ACCESS CONTROL — only allow clients reachable on the 3 internal nets.
    # Everything else (e.g. anything that leaks to the public NIC) is denied.
    # ====================================================================
    allow 172.16.100.0/22;
    allow 10.0.0.0/22;
    allow 172.16.0.0/22;
    allow 127.0.0.1;
    deny all;

    # Security headers (kept conservative — no HSTS since we're on plain HTTP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ====================================================================
    # BACKEND API — Rust axum server
    # CORS not set here: NEXT_PUBLIC_API_URL is same-origin, so the browser
    # never makes a cross-origin call. Agents (native binaries) don't care
    # about CORS. The backend's CORS_ALLOWED_ORIGINS still applies if you
    # later split origins.
    # ====================================================================
    location /api/ {
        proxy_pass http://rav_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;

        # Evidence uploads can be large (screenshots, recordings, archives).
        # Set high; the backend enforces real limits.
        client_max_body_size 2G;
        client_body_buffer_size 256k;
        client_body_timeout 600s;

        proxy_request_buffering off;  # stream uploads through
    }

    # ====================================================================
    # MINIO S3 API — used by:
    #   (a) the backend (server-to-server, hits 127.0.0.1 directly anyway)
    #   (b) clients downloading evidence via presigned URLs handed out by
    #       the backend. Those URLs MUST be signed with the same hostname
    #       the client uses, hence MINIO_SERVER_URL=http://172.16.100.41/minio.
    #
    # The trailing slash + proxy_pass with trailing slash strips /minio/
    # before forwarding (equivalent to Caddy's handle_path).
    # ====================================================================
    location /minio/ {
        proxy_pass http://rav_minio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # S3 multipart uploads / large object downloads
        client_max_body_size 0;            # unlimited — MinIO enforces
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Pass through range headers for partial downloads (video, archives)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # ====================================================================
    # MINIO CONSOLE — admin UI. Same allow-list as the server; if you want
    # to tighten it further, add another `allow`/`deny` inside this block.
    # ====================================================================
    location /console/ {
        proxy_pass http://rav_minio_console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;     # console uses WebSockets
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ====================================================================
    # NEXT.JS DASHBOARD — output: 'standalone', so it's a Node server on
    # :3000, not static files. Proxy everything else to it.
    # ====================================================================

    # Next's hashed static assets — long cache, no need to revalidate
    location /_next/static/ {
        proxy_pass http://rav_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://rav_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # Block hidden / backup files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss;

    # Logs
    error_log /var/log/nginx/rav_error.log;
    access_log /var/log/nginx/rav_access.log;
}
