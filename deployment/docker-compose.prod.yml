version: '3.8'

services:
  # Caddy handles HTTPS automatically and acts as the entry point
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - dashboard
      - minio

  # Backend API - ONLY accessible via Caddy (internal network)
  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgres://rav_user:rav_password@postgres:5432/rav_db
      - HOST=0.0.0.0
      - PORT=8080
      # IMPORTANT: Update these for production!
      - RUST_LOG=info
    expose:
      - "8080" # Not mapped to host, only internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dashboard Frontend - ONLY accessible via Caddy
  dashboard:
    build: 
      context: ../dashboard
      dockerfile: Dockerfile
    restart: always
    environment:
      # This needs to be built with the public domain
      - NEXT_PUBLIC_API_URL=https://${DOMAIN_NAME}/api
    expose:
      - "3000"

  # Minio Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  # Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: rav_user
      POSTGRES_PASSWORD: rav_password
      POSTGRES_DB: rav_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rav_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
  redis_data:
