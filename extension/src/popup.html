<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAV Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      width: 320px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e8e8e8;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .title {
      flex: 1;
    }

    .title h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .title .version {
      font-size: 11px;
      color: #888;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      color: #aaa;
    }

    .status-value {
      font-size: 13px;
      font-weight: 500;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.connected {
      background: #4CAF50;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
    }

    .status-dot.disconnected {
      background: #F44336;
      box-shadow: 0 0 8px rgba(244, 67, 54, 0.5);
    }

    .queue-badge {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e8e8e8;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      font-size: 11px;
      color: #666;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }

    .collecting-list {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
    }

    .collecting-list span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 8px;
    }

    .collecting-list span::before {
      content: '✓';
      color: #4CAF50;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">R</div>
    <div class="title">
      <h1>RAV Monitor</h1>
      <div class="version">v1.0.0</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Agent Connection</span>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-value" id="connectionStatus">Checking...</span>
      </div>
    </div>
    <div class="status-row">
      <span class="status-label">Pending Events</span>
      <span class="queue-badge" id="queueSize">0</span>
    </div>
    <div class="status-row">
      <span class="status-label">Last Sync</span>
      <span class="status-value" id="lastSync">Never</span>
    </div>
    <div class="collecting-list">
      <span>Active Tabs</span>
      <span>History</span>
      <span>Downloads</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="syncBtn">Sync Now</button>
    <button class="btn btn-secondary" id="clearBtn">Clear Queue</button>
  </div>

  <div class="footer">
    Secure • Local-only communication
  </div>

  <script src="popup.js"></script>
</body>
</html>
