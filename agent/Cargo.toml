[package]
name = "rav-agent"
version = "0.1.1"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

        # HTTP client for syncing to backend
        reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart"] }

# HTTP server for extension communication
axum = "0.7"
tower = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"

# Resource Monitoring
sysinfo = "0.30"

# Hashing
sha2 = "0.10"

# Configuration
config = "0.14"
dotenv = "0.15"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Network monitoring
pnet = "0.34"

# Image processing
image = "0.24"

# SQLite database access
rusqlite = { version = "0.31", features = ["bundled"] }

# URL parsing
url = "2.5"

# Hostname retrieval
hostname = "0.3"

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
winapi = { version = "0.3", features = ["winuser", "winsvc", "winreg", "winnls", "wincon", "dpapi", "wincrypt", "fileapi", "shlobj"] }
wmi = "0.13"
screenshots = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-services = "0.2"
io-kit-sys = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
systemd = "0.10"
udev = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

