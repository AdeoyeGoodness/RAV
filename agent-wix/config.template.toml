# RAV Agent Configuration Template
# This file is populated at install-time by the MSI installer.

[backend]
# url = "https://rav.handy.boats" # Population managed by MSI
# enrollment_token = ""         # Population managed by MSI
sync_interval_seconds = 10
heartbeat_interval_seconds = 60
# Enforce signed auto-updates: set to the code-signing cert thumbprint (no spaces). When set, the
# agent refuses any update MSI not validly signed by this cert. See deployment/AGENT_AUTOUPDATE.md.
# update_signer_thumbprint = ""

[agent]
# agent_id = ""                 # Population managed by MSI
# organization_id = ""          # Population managed by MSI
# hardware_fingerprint = ""     # Population managed by MSI
data_dir = "C:\\ProgramData\\RAV"

[encryption]
key_path = "C:\\ProgramData\\RAV\\encryption.key"

[monitoring.usb]
enabled = true
track_file_transfers = true

[monitoring.network]
enabled = true
track_dns = true
track_connections = true

[monitoring.screenshots]
enabled = true
capture_interval_seconds = 120
compression_quality = 60
max_width = 1280
format = "jpeg"

[stealth]
enabled = false
hide_files = false
tamper_detection = false
service_name = "AssetTelemetryService"
service_display_name = "Asset Telemetry Service"
